name: Downstream checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  browser-preview:
    # Playwright 1.60 is verified on 24.04; avoid ubuntu-latest's 26.04 migration.
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: apps/web-preview
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: apps/web-preview/package-lock.json
      - run: npm ci
      - run: npm run format:check
      - run: npm test
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-failure-traces
          path: apps/web-preview/test-results/
          retention-days: 7
