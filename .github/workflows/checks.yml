name: Isolated browser timing diagnostic
on:
  push:
    branches: [ci/scene-timing-20261104]
permissions:
  contents: read
jobs:
  browser-diagnostic:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        case: [split-a, split-b, original-controls]
    defaults:
      run:
        working-directory: apps/web-preview
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: apps/web-preview/package-lock.json
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Run selected tests with timing and resource samples
        shell: bash
        env:
          DIAGNOSTIC_CASE: ${{ matrix.case }}
        run: |
          mkdir -p diagnostic
          (while true; do
            date --iso-8601=seconds
            free -m
            ps -eo pid,ppid,rss,pcpu,comm --sort=-rss | head -25
            sleep 5
          done) > diagnostic/resources.log 2>&1 &
          monitor=$!
          trap 'kill "$monitor" 2>/dev/null || true' EXIT
          if [[ "$DIAGNOSTIC_CASE" == original-controls ]]; then
            files=(tests/browser/agate-west.spec.js tests/browser/batch-pointer-selection.spec.js tests/browser/fenton-basement.spec.js)
          else
            files=(tests/browser/gerlinger-portico.spec.js tests/browser/collier-bays.spec.js)
          fi
          set +e
          CI=1 DEBUG=pw:api npx playwright test "${files[@]}" --reporter=list > diagnostic/playwright.log 2>&1
          result=$?
          tail -n 150 diagnostic/playwright.log
          exit "$result"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: scene-diagnostic-${{ matrix.case }}
          path: |
            apps/web-preview/diagnostic/
            apps/web-preview/test-results/
          retention-days: 7
