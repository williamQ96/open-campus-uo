name: Isolated Chromium thread diagnostic
on:
  push:
    branches: [ci/scene-timing-20261104]
permissions:
  contents: read
jobs:
  chromium-thread-diagnostic:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    defaults:
      run:
        working-directory: apps/web-preview
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: apps/web-preview/package-lock.json
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Profile unchanged original Collier test
        shell: bash
        run: |
          mkdir -p diagnostic
          rm -f ../../docs/images/collier-bays-{east,north}-{before,after}-2026-11-04.png
          python diagnostic-thread-sampler.py > diagnostic/threads.log 2>&1 &
          monitor=$!
          trap 'kill "$monitor" 2>/dev/null || true' EXIT
          set +e
          CI=1 DEBUG=pw:api DEBUG_COLORS=0 npx playwright test tests/browser/diagnostic-original-collier.spec.js --reporter=list > diagnostic/playwright.log 2>&1
          result=$?
          tail -n 100 diagnostic/playwright.log
          exit "$result"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: chromium-thread-diagnostic
          path: |
            apps/web-preview/diagnostic/
            apps/web-preview/test-results/
            docs/images/collier-bays-*-2026-11-04.png
          retention-days: 7
