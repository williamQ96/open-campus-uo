name: Isolated browser context comparison
on:
  push:
    branches: [ci/scene-timing-20261104]
permissions:
  contents: read
jobs:
  context-comparison:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    strategy:
      fail-fast: false
      matrix:
        context: [fresh, reuse]
        repeat: [a, b]
    defaults:
      run:
        working-directory: apps/web-preview
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: apps/web-preview/package-lock.json
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Run original assertions with context isolation check
        shell: bash
        env:
          DIAG_CONTEXT: ${{ matrix.context }}
        run: |
          mkdir -p diagnostic
          python diagnostic-thread-sampler.py > diagnostic/threads.log 2>&1 &
          monitor=$!
          trap 'kill "$monitor" 2>/dev/null || true' EXIT
          set +e
          CI=1 DEBUG=pw:api DEBUG_COLORS=0 npx playwright test tests/browser/diagnostic-context-collier.spec.js --reporter=list > diagnostic/playwright.log 2>&1
          result=$?
          tail -n 100 diagnostic/playwright.log
          exit "$result"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: context-comparison-${{ matrix.context }}-${{ matrix.repeat }}
          path: |
            apps/web-preview/diagnostic/
            apps/web-preview/test-results/
          retention-days: 7
